const SEEDE={"title":"1 Coríntios Versículo 1","date":"2026-10-19","html":"<div>Autor: Apóstolo Paulo com apoio do escrevente Sóstenes<\/div><div>Período: 55–56 d.C.<\/div><div>Corinto fica localizada na região do Peloponeso, na Grécia, próxima a uma praia linda.<\/div><div><br><\/div><div>Paulo, em sua segunda viagem missionária, visitou a cidade de Corinto, onde permaneceu por um ano e meio ensinando a Palavra de Deus aos novos convertidos, após sua saída.<\/div><div>O livro de Coríntios é uma carta para a Igreja, na qual o apóstolo Paulo busca reestruturar a igreja que está perdendo a conduta cristã. Ensiná-los requeria que Paulo tivesse consciência de que, por mais que tentemos suprimir ou desencorajar as vontades da carne, não conseguimos extingui-las, por isso era necessário um tom de pastor no qual as palavras desse livro foram empregadas.<\/div><div><br><\/div><div>Leitura bíblica 19/10/2026 (4:00 às 5:00)<\/div><div><br><\/div><div>Primeiro capítulo: Saudação<\/div><div>Versículo 1: 1-3 Trata-se de uma saudação para os irmãos cristãos.<\/div><div><br><\/div><div>Segundo capítulo: A Gratidão de Paulo<\/div><div>Versículo 1: 4-9 Uma expressão de gratidão de Paulo a Jesus Cristo, pelos ensinamentos, pelos dons e por nos permitir dar a comunhão com o Pai através do seu sacrifício.<\/div><div>Versículo 9: Fiel é Deus, pelo qual fostes chamados para a comunhão de seu Filho Jesus Cristo, nosso Senhor.<\/div><div><br><\/div><div>Terceiro capítulo: Igreja Dividida<\/div><div>Versículo 1: 10-20<\/div><div>Paulo roga à igreja que se torne uma unidade na verdade em Cristo, visto que estavam separados em diversas certezas sobre o evangelho, que haviam se formado, tendo Paulo como batizador, Apolo e Cefas... esquecendo o evangelho de nosso Senhor Jesus Cristo. Sabendo, através da família de Cloé, que havia desentendimentos na igreja, Paulo escreve essa epístola a fim de unir a igreja novamente em uma certeza, Cristo Jesus, nosso Senhor e Salvador.<\/div><div>Nesse capítulo, Paulo direciona a fé para Cristo Jesus, o Senhor que nos torna um aos olhos do Pai.<\/div><div><br><\/div><div>Quarto capítulo: Aqueles a quem Deus Chama<\/div><div>Versículo 1: 21-31<\/div><div>Esse capítulo auxilia a igreja a reconhecer a Deus pela pregação, por mais louca que pareça, Cristo crucificado, o escândalo para judeus e loucura para os gregos. Ao fim do capítulo, fica claro que Paulo está pedindo para a igreja glorificar o Senhor e somente ao Senhor.<\/div><div>Versículo 25: Porque a loucura de Deus é mais sábia do que os homens, e a fraqueza de Deus é mais forte do que os homens.<\/div><div>Versículo 27: Mas Deus escolheu as coisas loucas deste mundo para confundir as sábias, e Deus escolheu as coisas fracas para confundir as fortes.<\/div>"};

const CH=/^[A-G][#b]?(?:m|M|maj|min|dim|aug|sus|add|º|°|\+|-|\d|\(\w+\)|\/[A-G][#b]?)*$/;
const isC=t=>{t=t.replace(/^\(+|\)+$/g,'');return t===''||CH.test(t)};
const E=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const FM=['Música','Cantor','Gênero'];let col={};
const cmp=(a,b)=>a.localeCompare(b,'pt',{sensitivity:'base'});
function sp(n){n=n.replace(/\.txt$/i,'').replace(/_/g,' ').trim();const m=n.match(/^(.*\S)\s+-\s+(.+)$/);return m?{title:m[1],artist:m[2]}:{title:n,artist:''}}
function fmt(tx){
 const pre=h('div','cp'),Q=[];let bl=1;
 tx.replace(/\r/g,'').replace(/\t/g,'    ').split('\n').forEach(r=>{
  r=r.replace(/\s+$/,'');
  if(!r.trim()){if(!bl){const d=h('div','bl');pre.append(d);Q.push({d,c:'bl',r:'',l:''})}bl=1;return}
  bl=0;const d=h('div'),tk=r.trim().split(/\s+/),m=r.match(/^(\s*\[[^\]]+\])(.*)$/);let c;
  if(m){c='lb';const rest=m[2];
   d.innerHTML='<i>'+E(m[1])+'</i>'+(rest.trim()&&rest.trim().split(/\s+/).every(isC)?'<u>'+E(rest)+'</u>':E(rest));
   if(!rest.trim())d.className='sc'}
  else if(/^[A-Ga-g]?\|[-\dhpbrx\/\\~|\s()]{6,}$/.test(r.trim())){c='tb';d.className='tb';d.innerHTML=E(r).replace(/\d+/g,'<u>$&</u>')}
  else if(tk.every(isC)&&tk.some(t=>CH.test(t.replace(/^\(+|\)+$/g,'')))){c='ch';d.className='ch';d.textContent=r}
  else{c='ly';d.className='ly';d.textContent=r.replace(/_/g,'-')}
  pre.append(d);Q.push({d,c,r,l:m?m[1]:''})});
 const pa=x=>x.c=='ly'&&/^\s*parte\b/i.test(x.r),n=Q.length;
 Q.forEach((x,i)=>{
  if(x.c!='lb'||!/solo|dedilhado|instrumental/i.test(x.l))return;
  let last=i,j=i+1;
  while(j<n){const y=Q[j];
   if(y.c=='bl'){j++;continue}
   if(y.c=='tb'||pa(y)){last=j;j++;continue}
   if(y.c=='ch'){let k=j+1;while(k<n&&Q[k].c=='bl')k++;
    if(k<n&&Q[k].c=='ly'&&!pa(Q[k]))break;last=j;j++;continue}
   break}
  if(Q[last+1]&&Q[last+1].c=='bl')last++;
  for(let q=i;q<=last;q++)Q[q].d.classList.add('sl')});
 return pre}
