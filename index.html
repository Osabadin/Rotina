const pct=(o,n)=>n?Math.round(o*100/n):0;
function ens(){const k=key(new Date());if(!S.days[k])S.days[k]={tasks:S.presets[new Date().getDay()].map(mk),rain:0,closed:0,touched:0};return S.days[k]}
function txt(k){
 const d=S.days[k],[y,m,dd]=k.split('-'),w=new Date(y,m-1,dd).getDay(),[n,o]=cnt(k);
 let s=dd+'/'+m+'/'+y+' - '+WD[w]+(d.rain?' - CHUVA':'')+'\nConcluídas: '+o+'/'+n+' ('+pct(o,n)+'%)\n\n';
 so(d).forEach(t=>{const v=stv(d,k,t);s+='['+(v==1?'OK':'--')+'] '+t.t+' '+t.x+(v==1&&t.at?' (cumprida às '+t.at+')':'')+(d.rain?' (chuva)':'')+(t.n?'\n     nota: '+t.n.replace(/\n/g,' / '):'')+'\n'});
 return s;
}
function roll(){
 const today=key(new Date());let ch=!S.days[today];
 for(const k in S.days){const d=S.days[k];if(k<today&&!d.closed){d.tasks.forEach(t=>{if(!t.s)t.s=-1});d.closed=1;S.logs[k]=txt(k);ch=1}}
 ens();if(ch)save();
}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

function bind(el,onTap,onSwipe){
 let x0=0,dx=0,id=null,mv=false;
 el.onpointerdown=e=>{x0=e.clientX;dx=0;id=e.pointerId;mv=false;el.style.transition='none'};
 el.onpointermove=e=>{if(id!==e.pointerId)return;dx=e.clientX-x0;if(Math.abs(dx)>10)mv=true;if(mv)el.style.transform='translateX('+dx*.6+'px)'};
 const end=e=>{if(id!==e.pointerId)return;id=null;el.style.transition='transform .2s';el.style.transform='';
  if(e.type=='pointercancel')return;if(Math.abs(dx)>70)onSwipe(dx>0?1:-1);else if(!mv)onTap()};
 el.onpointerup=end;el.onpointercancel=end;
}

function rowEl(k,d,t,cb,live){
 const v=stv(d,k,t),r=h('div','row'+(v==1?' ok':v<0?' no':'')),ds=h('div','ds',null,h('span',null,t.x));
 r.append(h('div','tm',t.t),ds);
 if(!live){if(t.n)ds.firstChild.append(h('span','nn',t.n));return r}
 if(t.n)ds.append(h('span','nt','✎'));
 bind(r,()=>/viol[aã]o/i.test(t.x)&&stack[stack.length-1]=='main'?(cur={k,t,cb},nav('cifras')):bubble(k,t,false,cb),dir=>{t.s=t.s===dir?(dir<0&&d.closed?-1:0):dir;if(t.s==1)t.at=hm(new Date())+':'+pad(new Date().getSeconds());else delete t.at;d.touched=1;cb()});
 return r;
}
function addRow(k,cb){const a=h('div','row add',null,h('div','tm','+'),h('div','ds','Adicionar'));a.onclick=()=>bubble(k,{t:hm(new Date()),x:'',n:'',s:0},true,cb);return a}

R.main=()=>{
 const k=key(new Date()),d=ens(),n=new Date(),s=$('main');s.textContent='';
 const rb=ib(P.drop,()=>{d.rain=d.rain?0:1;save();R.main()});rb.classList.toggle('on',!!d.rain);
 const sv=ib(P.save,()=>{save();dl('rotina_'+k+'.txt',txt(k));sv.classList.add('on');setTimeout(()=>sv.classList.remove('on'),1200)});
 const fb=h('button','ib tx','Aa');fb.onclick=()=>{S.font=((S.font||0)+1)%F.length;save();af()};
 s.append(top(ib(P.rep,()=>nav('report')),fb,rb,ib(P.list,()=>nav('presets')),sv));
 const dt=h('div','date',WD[n.getDay()]+', '+n.getDate()+' de '+MS[n.getMonth()]+' de '+n.getFullYear());
 if(d.rain)dt.insertAdjacentHTML('beforeend',ic(P.drop));
 const L=h('div','list');
 const cb=()=>{save();R.main()};
 so(d).forEach(t=>L.append(rowEl(k,d,t,cb,1)));
 L.append(addRow(k,cb));s.append(dt,L);
};

function bubble(k,t,isNew,cb){
 const d=S.days[k],ov=h('div','ov'),bx=h('div','bx');
 const tm=h('input','bt');tm.type='time';tm.value=t.t;
 const nm=h('input','bn');nm.value=t.x;nm.placeholder='Tarefa';
 const nt=h('textarea');nt.value=t.n||'';nt.rows=5;
 const fin=()=>{
  if(isNew){if(nm.value.trim()){d.tasks.push({t:tm.value||t.t,x:nm.value.trim(),s:0,n:nt.value.trim()});d.touched=1}}
  else{t.t=tm.value||t.t;if(nm.value.trim())t.x=nm.value.trim();t.n=nt.value.trim();d.touched=1}
  ov.remove();cb();
 };
 const x=h('button','bd','×');
 x.onclick=()=>{if(isNew){ov.remove();return}if(confirm('Excluir tarefa?')){d.tasks=d.tasks.filter(a=>a!==t);d.touched=1;ov.remove();cb()}};
 const ok=h('button','bk','Concluir');ok.onclick=fin;
 ov.onpointerdown=e=>{if(e.target==ov)fin()};
 bx.append(h('div','bh',null,tm,x),nm,nt,ok);ov.append(bx);document.body.append(ov);
 (isNew?nm:nt).focus();
}

R.presets=()=>{
 const s=$('presets');s.textContent='';s.append(top(ib(P.back,()=>history.back())));
 const tabs=h('div','tabs');
 [1,2,3,4,5,6,0].forEach(i=>{const b=h('button','tb'+(i==pd?' on':''),AB[i]);b.onclick=()=>{pd=i;R.presets()};tabs.append(b)});
 const a=S.presets[pd];a.sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:0);
 const L=h('div','list');
 a.forEach(p=>{
  const tm=h('input','pt');tm.type='time';tm.value=p.t;tm.onchange=()=>{p.t=tm.value||p.t;save();R.presets()};
  const tx=h('input','px');tx.value=p.x;tx.oninput=()=>{p.x=tx.value;save()};
  const dx=h('button','pd','×');dx.onclick=()=>{S.presets[pd]=a.filter(z=>z!==p);save();R.presets()};
  L.append(h('div','row',null,tm,tx,dx));
 });
 const ad=h('div','row add',null,h('div','tm','+'),h('div','ds','Adicionar'));
 ad.onclick=()=>{a.push({t:'08:00',x:''});save();R.presets();[...s.querySelectorAll('.px')].find(i=>!i.value).focus()};
 L.append(ad);s.append(tabs,L);
};

R.report=()=>{
 const s=$('report');s.textContent='';
 const ks=Object.keys(S.days).sort();let T=0,O=0;
 const L=h('div','list');
 ks.forEach(k=>{
  const [n,o]=cnt(k),d=S.days[k],[y,m,dd]=k.split('-'),w=new Date(y,m-1,dd).getDay(),p=pct(o,n);T+=n;O+=o;
  const r=h('div','rr',null,h('span',null,dd+' '+ms[m-1]+' - '+AB[w]+' - '+o+'/'+n+' | '+p+'%'));
  if(d.rain)r.insertAdjacentHTML('beforeend',ic(P.drop));
  const b=h('div','pb');b.style.setProperty('--p',p+'%');r.append(b);
  r.onclick=()=>{dk=k;ed=0;nav('detail')};L.append(r);
 });
 const p=pct(O,T),b=h('div','pb');b.style.setProperty('--p',p+'%');
 s.append(top(ib(P.back,()=>history.back()),ib(P.save,()=>dl('rotina_completo.txt',ks.map(k=>S.logs[k]||txt(k)).join('\n')))),
  h('div','rt',null,h('span',null,'Rotina assertiva'),h('b',null,p+'%'),b),L);
 L.scrollTop=L.scrollHeight;
};

R.detail=()=>{
 const k=dk,d=S.days[k],s=$('detail');s.textContent='';
 if(!d){history.back();return}
 const [y,m,dd]=k.split('-'),w=new Date(y,m-1,dd).getDay();
 const cb=()=>{if(d.closed)S.logs[k]=txt(k);save();R.detail()};
 const eb=ib(P.edit,()=>{ed=!ed;R.detail()});eb.classList.toggle('on',!!ed);
 let rb=null;if(ed){rb=ib(P.drop,()=>{d.rain=d.rain?0:1;cb()});rb.classList.toggle('on',!!d.rain)}
 const xb=ib(P.trash,()=>{if(confirm('Excluir este dia do histórico?')){delete S.days[k];delete S.logs[k];save();history.back()}});
 s.append(top(ib(P.back,()=>history.back()),eb,rb,xb,ib(P.save,()=>dl('rotina_'+k+'.txt',S.logs[k]||txt(k)))));
 const dt=h('div','date',WD[w]+', '+(+dd)+' de '+MS[m-1]+' de '+y);if(d.rain)dt.insertAdjacentHTML('beforeend',ic(P.drop));
 const L=h('div','list');
 so(d).forEach(t=>L.append(rowEl(k,d,t,cb,ed)));
 if(ed)L.append(addRow(k,cb));
 s.append(dt,L);
};

const CH=/^[A-G][#b]?(?:m|M|maj|min|dim|aug|sus|add|º|°|\+|-|\d|\(\w+\)|\/[A-G][#b]?)*$/;
const isC=t=>{t=t.replace(/^\(+|\)+$/g,'');return t===''||CH.test(t)};
const E=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function fmt(tx){
 const pre=h('div','cp');let bl=1;
 tx.replace(/\r/g,'').replace(/\t/g,'    ').split('\n').forEach(r=>{
  r=r.replace(/\s+$/,'');
  if(!r.trim()){if(!bl)pre.append(h('div','bl'));bl=1;return}
  bl=0;const d=h('div'),tk=r.trim().split(/\s+/),m=r.match(/^(\s*\[[^\]]+\])(.*)$/);
  if(m){const rest=m[2];
   d.innerHTML='<i>'+E(m[1])+'</i>'+(rest.trim()&&rest.trim().split(/\s+/).every(isC)?'<u>'+E(rest)+'</u>':E(rest));
   if(!rest.trim())d.className='sc'}
  else if(/^[A-Ga-g]?\|[-\dhpbrx\/\\~|\s()]{6,}$/.test(r.trim())){d.className='tb';d.innerHTML=E(r).replace(/\d+/g,'<u>$&</u>')}
  else if(tk.every(isC)&&tk.some(t=>CH.test(t.replace(/^\(+|\)+$/g,'')))){d.className='ch';d.textContent=r}
  else{d.className='ly';d.textContent=r.replace(/_/g,'-')}
  pre.append(d)});
 return pre}

R.cifras=()=>{
 const s=$('cifras');s.textContent='';
 const fi=h('input');fi.type='file';fi.accept='.txt,text/plain';fi.multiple=true;fi.hidden=true;
 fi.onchange=async()=>{for(const f of fi.files)S.cifras.push({id:Date.now()+Math.random().toString(36).slice(2,6),title:f.name.replace(/\.txt$/i,'').replace(/_/g,' '),text:(await f.text()).replace(/^\uFEFF/,'')});save();R.cifras()};
 s.append(top(ib(P.back,()=>history.back()),ib(P.edit,()=>cur&&bubble(cur.k,cur.t,false,cur.cb))),fi);
 const L=h('div','list');
 S.cifras.slice().sort((a,b)=>a.title.localeCompare(b.title,'pt')).forEach(c=>{
  const x=h('button','pd','×');x.onclick=e=>{e.stopPropagation();if(confirm('Excluir cifra?')){S.cifras=S.cifras.filter(z=>z!==c);save();R.cifras()}};
  const r=h('div','row',null,h('div','ds',c.title),x);r.onclick=()=>{cid=c.id;nav('player')};L.append(r)});
 const ad=h('div','row add',null,h('div','tm','+'),h('div','ds','Adicionar cifra'));ad.onclick=()=>fi.click();
 L.append(ad);s.append(L);
};

R.player=()=>{
 stopP();
 const c=S.cifras.find(a=>a.id==cid),s=$('player');s.textContent='';
 if(!c){history.back();return}
 let lv=S.cs||5,run=1,pos=0,last=0,t0=0,touch=0,hold=0,raf=0,wl=null;
 const sp=h('span','sp',String(lv)),pp=ib(P.pause,()=>tg());
 const tg=()=>{run=run?0:1;pp.innerHTML=ic(run?P.pause:P.play)};
 const set=d=>{lv=Math.max(1,Math.min(15,lv+d));S.cs=lv;sp.textContent=lv;save()};
 s.append(top(ib(P.back,()=>history.back()),ib(P.minus,()=>set(-1)),sp,ib(P.plus,()=>set(1)),pp));
 const box=h('div','cb'),pre=fmt(c.text);box.append(pre);s.append(box);
 let f=18;pre.style.fontSize=f+'px';
 while(f>9&&pre.offsetWidth>box.clientWidth-24){f-=.5;pre.style.fontSize=f+'px'}
 box.onclick=tg;
 box.addEventListener('touchstart',()=>{touch=1},{passive:true});
 const te=()=>{touch=0;hold=performance.now()+700};
 box.addEventListener('touchend',te);box.addEventListener('touchcancel',te);
 const step=ts=>{
  const dt=t0?Math.min(ts-t0,100)/1000:0;t0=ts;
  if(Math.abs(box.scrollTop-last)>1.5)pos=box.scrollTop;
  if(run&&!touch&&ts>hold){pos+=lv*3*dt;box.scrollTop=pos;last=box.scrollTop;
   if(box.scrollTop+box.clientHeight>=box.scrollHeight-2){run=0;pp.innerHTML=ic(P.play)}}
  raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step);
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(x=>{wl=x}).catch(()=>{})}catch(e){}
 stopP=()=>{cancelAnimationFrame(raf);try{wl&&wl.release()}catch(e){}};
};

function show(n){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==n));R[n]()}
function nav(n){stack.push(n);history.pushState(0,'');show(n)}
function back(){
 const p=stack.length>1?stack.pop():null;if(p=='player')stopP();
 if(p=='presets'){
  for(const i in S.presets)S.presets[i]=S.presets[i].filter(z=>z.x.trim());
  const d=ens();if(!d.touched&&!d.closed)d.tasks=S.presets[new Date().getDay()].map(mk);save();
 }
 show(stack[stack.length-1]);
}
function tick(){roll();if(stack[stack.length-1]=='main'&&!document.querySelector('.ov'))R.main()}

load();af();roll();history.replaceState(0,'');show('main');
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js');
addEventListener('popstate',back);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(tick,30000);
})();
</script></body></html>
