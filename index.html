<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2b2b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Rotina</title>
<style>
:root{--f:min(12px,3.1vw);--fs:15px;--ff:ui-monospace,Consolas,"Courier New",monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
::-webkit-scrollbar{display:none}
html,body{height:100%;background:#2b2b2b;color:#cfcfcf;font:15px var(--ff);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex}
.bar{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 4px;flex:none}
.bar div{display:flex}
.ib{width:46px;height:46px;color:#8f8f8f;display:flex;align-items:center;justify-content:center}
.ib.on{color:#6aa9ff}.ib.tx{font-size:16px}
.ib svg{width:21px;height:21px}
.date{text-align:left;font-size:min(20px,4.4vw);letter-spacing:.5px;color:#9a9a9a;padding:10px 10px 20px;display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:8px;flex:none}
.date svg{width:20px;height:20px;color:#6aa9ff;flex:none}
.list{flex:1;overflow-y:auto;padding:0 8px 28px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.row{display:flex;gap:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;flex:none}
.tm{width:76px;flex:none;min-height:50px;border:2px solid #555;background:#333;display:flex;align-items:center;justify-content:center;font-size:var(--fs)}
.ds{flex:1;min-width:0;min-height:50px;border:2px solid #555;background:#333;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fs);line-height:1.3}
.ds span:first-child{min-width:0;overflow-wrap:anywhere}
.nt{opacity:.7;font-size:13px;flex:none}
.nn{display:block;opacity:.75;font-size:12px;margin-top:3px}
.ok .tm,.ok .ds{background:#484848;border-color:#484848;color:#6ea8ff}
.no .tm,.no .ds{background:#484848;border-color:#484848;color:#ff6b6b}
.add .tm{font-size:30px;color:#9a9a9a}
.add .ds{color:#707070}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.bx{width:100%;max-width:420px;max-height:85%;overflow:auto;background:#333;border:2px solid #777;padding:12px;display:flex;flex-direction:column;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:center}
input,textarea{font:inherit;color:#cfcfcf;background:none;border:0;border-bottom:1px solid #555;outline:0;width:100%;padding:6px 2px;caret-color:#cfcfcf;color-scheme:dark}
.bt{width:auto;font-size:var(--fs);border:0;padding:2px}
.bn{font-size:18px;letter-spacing:1px}
textarea{resize:none;border:1px solid #555;padding:8px;font-size:14px}
.bk{border:1px solid #888;text-align:center;padding:11px}
.bd{color:#8a8a8a;font-size:24px;width:36px;height:36px}
.tabs{display:flex;padding:0 8px 10px;gap:4px;flex:none}
.tb{flex:1;padding:9px 0;border:1px solid #555;color:#8a8a8a;font-size:12px;text-align:center}
.tb.on{background:#484848;color:#e6e6e6;border-color:#484848}
.row .pt{width:76px;flex:none;border:2px solid #555;background:#333;text-align:center;font-size:var(--fs);padding:12px 0}
.row .px{flex:1;width:auto;min-width:0;border:2px solid #555;background:#333;padding:0 10px;font-size:var(--fs)}
.row .pd{width:34px;flex:none}
.rt{display:flex;align-items:center;justify-content:center;gap:8px;font-size:calc(var(--f)*2);padding:10px 8px 20px;color:#9a9a9a;flex:none;white-space:nowrap}
.rt b{color:#e6e6e6;font-weight:700}
.rr{display:flex;align-items:center;gap:6px;padding:10px 6px;font-size:var(--f);border-bottom:1px solid #404040;flex:none}
.rr svg{width:13px;height:13px;color:#6aa9ff;flex:none}
.pb{width:56px;height:14px;border:1px solid #666;flex:none;margin-left:auto;background:linear-gradient(90deg,#8f8f8f var(--p),transparent 0)}
.rt .pb{margin-left:0;width:60px;height:18px}
</style></head><body>
<div class="scr" id="main"></div><div class="scr" id="presets"></div><div class="scr" id="report"></div><div class="scr" id="detail"></div>
<script>
(()=>{
const K='rotina_v1',B='rotina_bak';
const pad=n=>String(n).padStart(2,'0'),$=id=>document.getElementById(id);
const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],AB=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],ms=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const h=(t,c,x,...k)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;k.forEach(a=>a&&e.append(a));return e};
const P={drop:'M12 3c3.5 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 2.5-6.5 6-11z',rep:'M5 20V10M12 20V4M19 20v-7',list:'M4 7h16M4 12h16M4 17h16',save:'M12 4v11m-5-5 5 5 5-5M5 20h14',back:'M15 5l-7 7 7 7',edit:'M4 20l4-1 11-11-3-3L5 16l-1 4z',trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13'};
const ic=p=>'<svg viewBox="0 0 24 24"><path d="'+p+'"/></svg>';
const ib=(p,f)=>{const b=h('button','ib');b.innerHTML=ic(p);b.onclick=f;return b};
const top=(l,...r)=>h('div','bar',null,l,h('div',null,null,...r));
const R={};let S,stack=['main'],pd=new Date().getDay(),dk='',ed=0;
const F=['ui-monospace,Consolas,"Courier New",monospace','system-ui,Roboto,Arial,sans-serif','Georgia,"Noto Serif",serif','sans-serif-condensed,"Roboto Condensed",Arial,sans-serif'];
const af=()=>document.documentElement.style.setProperty('--ff',F[S.font||0]);
try{localStorage.setItem('t','1');localStorage.removeItem('t')}catch(e){alert('Armazenamento indisponível. Abra o arquivo pelo Chrome.')}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const SEED={"1":[["04:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Corrida 1h"],["05:20","Banho"],["05:35","Leitura Bíblica"],["06:10","Saída para trabalho"],["07:00","Início expediente"],["11:20","Saída almoço"],["12:15","Volta almoço"],["17:15","Fim do expediente"],["17:50","Musculação"],["19:00","Banho"],["19:50","Oração"],["20:20","Leitura (Definir fila de leitura)"],["21:00","Dormir"]],"2":[["04:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Banho gelado"],["04:35","Leitura Bíblica"],["05:15","Projeto (Meus planos pro futuro)"],["06:15","Saída para trabalho"],["07:00","Início expediente"],["11:20","Saída almoço"],["12:15","Volta almoço"],["17:15","Fim do expediente"],["17:50","Musculação"],["19:00","Banho"],["19:50","Oração"],["20:20","Leitura (Definir fila de leitura)"],["21:00","Dormir"]],"3":[["04:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Corrida 1h"],["05:20","Banho"],["05:35","Leitura Bíblica"],["06:10","Saída para trabalho"],["07:00","Início expediente"],["11:20","Saída almoço"],["12:15","Volta almoço"],["17:15","Fim do expediente"],["17:50","Musculação"],["19:00","Banho"],["19:50","Afilhadas e Família"],["20:20","Leitura (Definir fila de leitura)"],["21:00","Dormir"]],"4":[["04:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Banho gelado"],["04:35","Leitura Bíblica"],["05:15","Projeto (Meus planos pro futuro)"],["06:15","Saída para trabalho"],["07:00","Início expediente"],["11:20","Saída almoço"],["12:15","Volta almoço"],["17:15","Fim do expediente"],["17:50","Musculação"],["19:00","Banho"],["19:30","Culto"],["21:50","Dormir"]],"5":[["04:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Corrida 1h"],["05:20","Banho"],["05:35","Leitura Bíblica"],["06:10","Saída para trabalho"],["07:00","Início expediente"],["11:20","Saída almoço"],["12:15","Volta almoço"],["17:15","Fim do expediente"],["17:50","Musculação"],["19:00","Banho"],["19:50","Oração"],["20:20","Leitura (Definir fila de leitura)"],["21:30","Estudos avançados (Defina seus estudos)"]],"6":[["04:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Banho gelado"],["04:40","Inglês (2 horas todo sábado)"],["06:40","Leitura Bíblica"],["07:40","Desjejum (pão e ovos)"],["08:30","Preparar o almoço (definir e comprar os itens)."],["09:30","Manutenções da casa (limpeza interna, externa, roupas sujas, retoques na estrutura)"],["10:30","Preparar o almoço e o chimarrão"],["11:20","Tomar chimarrão com a mãe"],["12:30","Almoço com a mãe"],["15:00","Visitar ás afilhadas"],["17:00","Oração"],["18:00","Preparação para culto Jovem"],["18:30","Ensaio do coral"],["19:30","Culto da Juventude"],["21:30","Encerramento do Culto"],["22:00","Dormir"]],"0":[["05:00","Acordar, Arrumar a cama e Agradecer"],["04:20","Banho gelado"],["04:40","Inglês (2 horas todo sábado)"],["06:40","Leitura Bíblica"],["07:40","Desjejum (pão e ovos)"],["09:30","Preparar o almoço (definir e comprar os itens)"],["10:00","Chimarrão"],["10:10","Revisão financeira Mãe e Eu"],["12:00","Almoço com a mãe"],["14:00","Projeto (Meus planos pro futuro)"],["18:30","Preparação para o culto"],["19:30","Culto da Família"],["21:40","Encerramento do Culto"],["22:00","Dormir"]]};
function mig(){if(S.seed==2)return;S.presets={};for(const i in SEED)S.presets[i]=SEED[i].map(a=>({t:a[0],x:a[1]}));S.seed=2;const d=S.days[key(new Date())];if(d&&!d.touched&&!d.closed)d.tasks=S.presets[new Date().getDay()].map(mk)}
function load(){
 for(const k of [K,B]){try{const j=JSON.parse(localStorage.getItem(k));if(j&&j.days&&j.presets){S=j;mig();return}}catch(e){}}
 S={presets:{},days:{},logs:{}};
 mig();
}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(K,j);localStorage.setItem(B,j)}catch(e){}}
const mk=p=>({t:p.t,x:p.x,s:0,n:''});
const so=d=>d.tasks.slice().sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);
const stv=(d,k,t)=>t.s||((d.closed||k<key(new Date())||t.t<hm(new Date()))?-1:0);
const cnt=k=>{const d=S.days[k];return [d.tasks.length,d.tasks.filter(t=>stv(d,k,t)==1).length]};
const pct=(o,n)=>n?Math.round(o*100/n):0;
function ens(){const k=key(new Date());if(!S.days[k])S.days[k]={tasks:S.presets[new Date().getDay()].map(mk),rain:0,closed:0,touched:0};return S.days[k]}
function txt(k){
 const d=S.days[k],[y,m,dd]=k.split('-'),w=new Date(y,m-1,dd).getDay(),[n,o]=cnt(k);
 let s=dd+'/'+m+'/'+y+' - '+WD[w]+(d.rain?' - CHUVA':'')+'\nConcluídas: '+o+'/'+n+' ('+pct(o,n)+'%)\n\n';
 so(d).forEach(t=>{const v=stv(d,k,t);s+='['+(v==1?'OK':'--')+'] '+t.t+' '+t.x+(v==1&&t.at?' (cumprida às '+t.at+')':'')+(d.rain?' (chuva)':'')+(t.n?'\n     nota: '+t.n.replace(/\n/g,' / '):'')+'\n'});
 return s;
}
function roll(){
 const today=key(new Date());let ch=!S.days[today];
 for(const k in S.days){const d=S.days[k];if(k<today&&!d.closed){d.tasks.forEach(t=>{if(!t.s)t.s=-1});d.closed=1;S.logs[k]=txt(k);ch=1}}
 ens();if(ch)save();
}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

function bind(el,onTap,onSwipe){
 let x0=0,dx=0,id=null,mv=false;
 el.onpointerdown=e=>{x0=e.clientX;dx=0;id=e.pointerId;mv=false;el.style.transition='none'};
 el.onpointermove=e=>{if(id!==e.pointerId)return;dx=e.clientX-x0;if(Math.abs(dx)>10)mv=true;if(mv)el.style.transform='translateX('+dx*.6+'px)'};
 const end=e=>{if(id!==e.pointerId)return;id=null;el.style.transition='transform .2s';el.style.transform='';
  if(e.type=='pointercancel')return;if(Math.abs(dx)>70)onSwipe(dx>0?1:-1);else if(!mv)onTap()};
 el.onpointerup=end;el.onpointercancel=end;
}

function rowEl(k,d,t,cb,live){
 const v=stv(d,k,t),r=h('div','row'+(v==1?' ok':v<0?' no':'')),ds=h('div','ds',null,h('span',null,t.x));
 r.append(h('div','tm',t.t),ds);
 if(!live){if(t.n)ds.firstChild.append(h('span','nn',t.n));return r}
 if(t.n)ds.append(h('span','nt','✎'));
 bind(r,()=>bubble(k,t,false,cb),dir=>{t.s=t.s===dir?(dir<0&&d.closed?-1:0):dir;if(t.s==1)t.at=hm(new Date())+':'+pad(new Date().getSeconds());else delete t.at;d.touched=1;cb()});
 return r;
}
function addRow(k,cb){const a=h('div','row add',null,h('div','tm','+'),h('div','ds','Adicionar'));a.onclick=()=>bubble(k,{t:hm(new Date()),x:'',n:'',s:0},true,cb);return a}

R.main=()=>{
 const k=key(new Date()),d=ens(),n=new Date(),s=$('main');s.textContent='';
 const rb=ib(P.drop,()=>{d.rain=d.rain?0:1;save();R.main()});rb.classList.toggle('on',!!d.rain);
 const sv=ib(P.save,()=>{save();dl('rotina_'+k+'.txt',txt(k));sv.classList.add('on');setTimeout(()=>sv.classList.remove('on'),1200)});
 const fb=h('button','ib tx','Aa');fb.onclick=()=>{S.font=((S.font||0)+1)%F.length;save();af()};
 s.append(top(ib(P.rep,()=>nav('report')),fb,rb,ib(P.list,()=>nav('presets')),sv));
 const dt=h('div','date',WD[n.getDay()]+', '+n.getDate()+' de '+MS[n.getMonth()]+' de '+n.getFullYear());
 if(d.rain)dt.insertAdjacentHTML('beforeend',ic(P.drop));
 const L=h('div','list');
 const cb=()=>{save();R.main()};
 so(d).forEach(t=>L.append(rowEl(k,d,t,cb,1)));
 L.append(addRow(k,cb));s.append(dt,L);
};

function bubble(k,t,isNew,cb){
 const d=S.days[k],ov=h('div','ov'),bx=h('div','bx');
 const tm=h('input','bt');tm.type='time';tm.value=t.t;
 const nm=h('input','bn');nm.value=t.x;nm.placeholder='Tarefa';
 const nt=h('textarea');nt.value=t.n||'';nt.rows=5;
 const fin=()=>{
  if(isNew){if(nm.value.trim()){d.tasks.push({t:tm.value||t.t,x:nm.value.trim(),s:0,n:nt.value.trim()});d.touched=1}}
  else{t.t=tm.value||t.t;if(nm.value.trim())t.x=nm.value.trim();t.n=nt.value.trim();d.touched=1}
  ov.remove();cb();
 };
 const x=h('button','bd','×');
 x.onclick=()=>{if(isNew){ov.remove();return}if(confirm('Excluir tarefa?')){d.tasks=d.tasks.filter(a=>a!==t);d.touched=1;ov.remove();cb()}};
 const ok=h('button','bk','Concluir');ok.onclick=fin;
 ov.onpointerdown=e=>{if(e.target==ov)fin()};
 bx.append(h('div','bh',null,tm,x),nm,nt,ok);ov.append(bx);document.body.append(ov);
 (isNew?nm:nt).focus();
}

R.presets=()=>{
 const s=$('presets');s.textContent='';s.append(top(ib(P.back,()=>history.back())));
 const tabs=h('div','tabs');
 [1,2,3,4,5,6,0].forEach(i=>{const b=h('button','tb'+(i==pd?' on':''),AB[i]);b.onclick=()=>{pd=i;R.presets()};tabs.append(b)});
 const a=S.presets[pd];a.sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:0);
 const L=h('div','list');
 a.forEach(p=>{
  const tm=h('input','pt');tm.type='time';tm.value=p.t;tm.onchange=()=>{p.t=tm.value||p.t;save();R.presets()};
  const tx=h('input','px');tx.value=p.x;tx.oninput=()=>{p.x=tx.value;save()};
  const dx=h('button','pd','×');dx.onclick=()=>{S.presets[pd]=a.filter(z=>z!==p);save();R.presets()};
  L.append(h('div','row',null,tm,tx,dx));
 });
 const ad=h('div','row add',null,h('div','tm','+'),h('div','ds','Adicionar'));
 ad.onclick=()=>{a.push({t:'08:00',x:''});save();R.presets();[...s.querySelectorAll('.px')].find(i=>!i.value).focus()};
 L.append(ad);s.append(tabs,L);
};

R.report=()=>{
 const s=$('report');s.textContent='';
 const ks=Object.keys(S.days).sort();let T=0,O=0;
 const L=h('div','list');
 ks.forEach(k=>{
  const [n,o]=cnt(k),d=S.days[k],[y,m,dd]=k.split('-'),w=new Date(y,m-1,dd).getDay(),p=pct(o,n);T+=n;O+=o;
  const r=h('div','rr',null,h('span',null,dd+' '+ms[m-1]+' - '+AB[w]+' - '+o+'/'+n+' | '+p+'%'));
  if(d.rain)r.insertAdjacentHTML('beforeend',ic(P.drop));
  const b=h('div','pb');b.style.setProperty('--p',p+'%');r.append(b);
  r.onclick=()=>{dk=k;ed=0;nav('detail')};L.append(r);
 });
 const p=pct(O,T),b=h('div','pb');b.style.setProperty('--p',p+'%');
 s.append(top(ib(P.back,()=>history.back()),ib(P.save,()=>dl('rotina_completo.txt',ks.map(k=>S.logs[k]||txt(k)).join('\n')))),
  h('div','rt',null,h('span',null,'Rotina assertiva'),h('b',null,p+'%'),b),L);
 L.scrollTop=L.scrollHeight;
};

R.detail=()=>{
 const k=dk,d=S.days[k],s=$('detail');s.textContent='';
 if(!d){history.back();return}
 const [y,m,dd]=k.split('-'),w=new Date(y,m-1,dd).getDay();
 const cb=()=>{if(d.closed)S.logs[k]=txt(k);save();R.detail()};
 const eb=ib(P.edit,()=>{ed=!ed;R.detail()});eb.classList.toggle('on',!!ed);
 let rb=null;if(ed){rb=ib(P.drop,()=>{d.rain=d.rain?0:1;cb()});rb.classList.toggle('on',!!d.rain)}
 const xb=ib(P.trash,()=>{if(confirm('Excluir este dia do histórico?')){delete S.days[k];delete S.logs[k];save();history.back()}});
 s.append(top(ib(P.back,()=>history.back()),eb,rb,xb,ib(P.save,()=>dl('rotina_'+k+'.txt',S.logs[k]||txt(k)))));
 const dt=h('div','date',WD[w]+', '+(+dd)+' de '+MS[m-1]+' de '+y);if(d.rain)dt.insertAdjacentHTML('beforeend',ic(P.drop));
 const L=h('div','list');
 so(d).forEach(t=>L.append(rowEl(k,d,t,cb,ed)));
 if(ed)L.append(addRow(k,cb));
 s.append(dt,L);
};

function show(n){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==n));R[n]()}
function nav(n){stack.push(n);history.pushState(0,'');show(n)}
function back(){
 const p=stack.length>1?stack.pop():null;
 if(p=='presets'){
  for(const i in S.presets)S.presets[i]=S.presets[i].filter(z=>z.x.trim());
  const d=ens();if(!d.touched&&!d.closed)d.tasks=S.presets[new Date().getDay()].map(mk);save();
 }
 show(stack[stack.length-1]);
}
function tick(){roll();if(stack[stack.length-1]=='main'&&!document.querySelector('.ov'))R.main()}

load();af();roll();history.replaceState(0,'');show('main');
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js');
addEventListener('popstate',back);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(tick,30000);
})();
</script></body></html>
